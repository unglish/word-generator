<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Vocal OG capture · Unglish</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f3f3;
      --fg: #191919;
      --muted: #626262;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-serif, Georgia, "Times New Roman", serif;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }
    #head {
      position: absolute;
      inset: 0;
      background: var(--bg);
    }
    .mark {
      position: absolute;
      left: 4.5%;
      bottom: 4.5%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 0.15em;
      line-height: 1;
    }
    .mark .brand {
      font-size: clamp(1.35rem, 4.2vw, 2.35rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--fg);
    }
    .mark .tag {
      font-size: clamp(0.55rem, 1.5vw, 0.85rem);
      color: var(--muted);
      font-style: italic;
      letter-spacing: 0.04em;
    }
    .copy {
      display: none;
    }
    #ready {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--muted);
      font-size: 1rem;
      z-index: 3;
    }
    #ready[hidden] { display: none; }

    /* Landscape OG poster (1200×630): head left, conversion copy right. */
    body.poster #stage {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(18rem, 0.85fr);
    }
    body.poster #head {
      position: relative;
      inset: auto;
      width: 100%;
      height: 100%;
    }
    body.poster .mark { display: none; }
    body.poster .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.85rem;
      padding: 2.25rem 2.6rem 2.25rem 1.4rem;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(243, 243, 243, 0) 0%, var(--bg) 18%, var(--bg) 100%);
    }
    body.poster .copy .brand {
      font-size: 1.55rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      line-height: 1;
    }
    body.poster .copy .headline {
      font-size: 2.35rem;
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.01em;
      text-wrap: balance;
      max-width: 11ch;
    }
    body.poster .copy .cta {
      margin-top: 0.35rem;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--muted);
      letter-spacing: 0.01em;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="head" aria-hidden="true"></div>
    <div class="mark" aria-hidden="true">
      <span class="brand">Unglish</span>
      <span class="tag">vocal demo</span>
    </div>
    <div class="copy" aria-hidden="true">
      <span class="brand">Unglish</span>
      <span class="headline">Nonce words, spoken aloud</span>
      <span class="cta">Try the Chimera vocal demo →</span>
    </div>
    <div id="ready">Loading head…</div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("mode") === "poster") {
      document.body.classList.add("poster");
    }
  </script>
  <script type="module" src="./vocal/og-capture.ts"></script>
</body>
</html>
