name: Main

# Runs on every push to main: the pre-release gate. Pull requests only lint,
# typecheck and build (ci.yml); the full test suite (tests.yml) and the review
# end-to-end suite run here, and the demo deploys to GitHub Pages only after
# both pass on that commit. The paired performance gate also runs here for
# visibility, but does not block Pages. Dispatch it manually to redeploy
# without a new commit (for example after changing a repository variable).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per ref, in push order, so a newer push cannot be overtaken
# by an older queued run. A third push while one is queued replaces the queued
# run; the newest commit still deploys. A manual re-run of an *older* failed
# run is not protected: only re-run the newest.
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  review-e2e:
    uses: ./.github/workflows/review-e2e.yml

  # Paired perf gate, advisory on main: deploy does not wait on it. It times
  # the previous main commit and this one back to back on the same runner and
  # fails on a relative slowdown, because absolute words/sec varies about 3x
  # between runner hosts. The fixed floor (`npm run test:perf`) stays a local
  # check. See scripts/perf-compare.mjs.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
      # `before` is the previous tip of main for a push; a dispatch or a
      # force-push without that commit falls back to the parent.
      - name: Check out the previous main commit
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^)
          fi
          echo "Comparing $(git rev-parse --short HEAD) against $(git rev-parse --short "$base")"
          git worktree add --detach ../perf-base "$base"
          ln -s "$PWD/node_modules" ../perf-base/node_modules
      - name: Paired perf gate (fails on a >5% median slowdown)
        run: npm run perf:compare -- --base ../perf-base

  deploy:
    needs: [checks, review-e2e]
    # `success()` keeps the implicit "all needs passed" condition; the ref check
    # turns a dispatch from another branch into a skip rather than an
    # environment-protection failure.
    if: success() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
      - run: npm run build
        env:
          VITE_REVIEW_SUPABASE_URL: ${{ vars.VITE_REVIEW_SUPABASE_URL }}
          VITE_REVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_REVIEW_SUPABASE_PUBLISHABLE_KEY }}
          VITE_REVIEW_STUDY_ID: ${{ vars.VITE_REVIEW_STUDY_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo/
      - id: deployment
        uses: actions/deploy-pages@v4
