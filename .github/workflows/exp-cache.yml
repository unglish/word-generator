name: Experiment cache
on:
  push:
    branches: ['exp/cache-**']
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
  hit:
    needs: seed
    strategy:
      matrix: { i: [1, 2, 3, 4] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint && npm run typecheck && npm run build
  baseline:
    strategy:
      matrix: { i: [1, 2, 3, 4] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build
