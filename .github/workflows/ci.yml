name: CI

# The pull-request gate: lint, typecheck and build, about a minute. Tests do
# not run on PRs. Run `npm run check` locally before pushing; the full suite
# (tests.yml) runs on every push to main and gates the Pages deploy. To run
# it on a branch before merging, dispatch the Tests workflow on that branch.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `verify` is the only required status check in the repository's Main
  # ruleset, so it is the merge gate. Renaming this job blocks every merge
  # until the ruleset is updated.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
