name: CI

# Fast, deterministic checks for every pull request. `npm run check` runs the
# lint, typecheck, unit-test, and review unit-test steps locally; CI also
# builds and runs `test:diagnostics`. The main-branch workflow reuses this
# file so main re-runs exactly what PRs ran before it deploys.

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # `test` is the only required status check in the repository's Main ruleset,
  # so it is the merge gate: lint and typecheck live here on purpose. `build`
  # and `review-unit` are advisory. Renaming this job blocks every merge until
  # the ruleset is updated.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Diagnostic sampling and metric regressions
        run: npm run test:diagnostics

  review-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:review
