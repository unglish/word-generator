name: Diag E2E port flake

# Throwaway diagnostic. Round 3: validate both proposed review-e2e fixes on
# real runners (Playwright without apt, Supabase ports reserved).

on:
  push:
    branches: [diag/e2e-port-flake]

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - name: Keep Supabase ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - run: echo "image $ImageOS $ImageVersion"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Shared libraries Chromium needs that are missing
        run: |
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) -exec ldd {} \; | grep 'not found' | sort -u)
          echo "${missing:-none}"
          test -z "$missing"
      - name: What --with-deps would have installed (informational)
        run: npx playwright install-deps --dry-run chromium || true
      - run: npm run test:review:e2e
      - run: npx supabase start
      - run: npm run test:review:db
      - run: npm run test:review:smoke
      - if: always()
        run: npx supabase stop
