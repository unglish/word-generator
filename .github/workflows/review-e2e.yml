name: Review E2E

# Browser, database, and smoke checks for the human-review app. These need
# Playwright and a local Supabase stack, so pull requests only run them when
# review code, its config, or package dependencies change. Generator changes
# under src/ are covered by the review unit tests on every PR and by this
# suite on every push to main, before the demo deploys.

on:
  pull_request:
    branches: [main]
    paths:
      - 'evaluation/review/**'
      - 'demo/review/**'
      - 'demo/review.html'
      - 'supabase/**'
      - 'playwright.review.config.ts'
      - 'vitest.review-db.config.ts'
      - 'tsconfig.review.json'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/review-e2e.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: review-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review-e2e:
    runs-on: ubuntu-latest
    steps:
      # Supabase's fixed ports 54320-54329 lie in Linux's ephemeral range. If an
      # earlier outbound connection was given one, it holds the port (TIME_WAIT
      # lasts 60 s) and `supabase start` fails with "address already in use".
      - name: Keep Supabase ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # No --with-deps: the runner image already has every library Chromium
      # needs, so it would only apt-install nine optional font packages. That
      # makes the job depend on the image's apt sources, which one ubuntu26
      # build shipped without (exit 100: "Unable to locate package").
      - run: npx playwright install chromium
      - run: npm run test:review:e2e
      - run: npx supabase start
      - run: npm run test:review:db
      - run: npm run test:review:smoke
      - if: always()
        run: npx supabase stop
